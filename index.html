<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f8fc" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="TrickLog" />
  <meta name="description" content="回数制の練習メニュー作成と成功率の記録ができるオフライン対応アプリ" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="icon" href="./icons/icon-192.png" />
  <link rel="stylesheet" href="./styles.css" />
  <title>TrickLog | 練習ログ</title>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">◎</span><div><strong>TrickLog</strong><small>練習を、積み上げる。 v1.0.1</small></div></div>
      <div class="local-pill"><span class="local-dot"></span>この端末に保存</div>
    </header>
    <main id="app" aria-live="polite"></main>
    <nav class="bottomnav" aria-label="メインメニュー">
      <button type="button" data-nav="practice" class="nav-btn"><span class="nav-icon">◉</span><span>練習</span></button>
      <button type="button" data-nav="menu" class="nav-btn"><span class="nav-icon">☷</span><span>メニュー</span></button>
      <button type="button" data-nav="history" class="nav-btn"><span class="nav-icon">▤</span><span>履歴・共有</span></button>
    </nav>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="modal-root"></div>
  <script src="./app.js" defer></script>
</body>
</html>
